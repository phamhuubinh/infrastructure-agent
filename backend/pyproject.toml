[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "orion"
dynamic = ["version"]
description = "Local-first conversational technical workbench"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "fastembed==0.8.1",
  "numpy==2.5.3",
  "onnxruntime==1.30.0",
  "tokenizers==0.23.2",
  "fastapi>=0.115,<1",
  "httpcore>=1,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "pydantic>=2.9,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "types-openpyxl>=3.1,<4",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
orion = "orion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orion"]

[tool.hatch.version]
path = "src/orion/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["orion"]
exclude = ["tests"]
