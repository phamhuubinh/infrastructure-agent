# GA1 stage-level route expectations. These are curated route contracts, not
# generated answers; final prose is intentionally outside this fixture.
schema_version: 1

groups:
  A: General Chat
  B: Intent Resolution
  I: Assessment
  M: Prompt Injection

cases:
  - id: ga1-stable-general-no-tool
    group: A
    source: general_agent_backlog
    tags: [vi, general, stable]
    question: "RAM và swap khác nhau thế nào?"
    expected:
      concepts: []
      operation: null
      intent: null
      target: null
      params: {}
      answer_type: null
      routing_status: chat
      evidence_status: not_applicable
      answer_strategy: CHAT
      llm_usage_reason: NONE
      required_evidence: []
      request_domain: GENERAL
      information_scope: STABLE_KNOWLEDGE
      external_need: NONE
      source_constraints: [ANY]
      execution_intent: EXPLAIN
    harness_error: false
    note: "Stable conceptual knowledge must bypass environment and Internet collection."

  - id: ga1-current-external-required
    group: I
    source: general_agent_backlog
    tags: [vi, external, current, provenance]
    question: "Phiên bản Python stable mới nhất hiện tại là gì?"
    expected:
      concepts: []
      operation: null
      intent: null
      target: null
      params: {}
      answer_type: null
      routing_status: external_verification
      evidence_status: sufficient
      answer_strategy: LLM_ASSESSMENT
      llm_usage_reason: EXPECTED_ASSESSMENT
      required_evidence: []
      request_domain: EXTERNAL_INFORMATION
      information_scope: CURRENT_EXTERNAL
      external_need: REQUIRED
      source_constraints: [ANY]
      execution_intent: EXPLAIN
    harness_error: false
    note: "A configured test provider must yield fetched evidence and provenance before assessment."

  - id: ga1-explicit-url-fetch
    group: I
    source: general_agent_backlog
    tags: [vi, external, url, ssrf]
    question: "Đọc https://example.com và tóm tắt nội dung chính."
    expected:
      concepts: []
      operation: null
      intent: null
      target: null
      params: {}
      answer_type: null
      routing_status: external_verification
      evidence_status: sufficient
      answer_strategy: LLM_ASSESSMENT
      llm_usage_reason: EXPECTED_ASSESSMENT
      required_evidence: []
      request_domain: EXTERNAL_INFORMATION
      information_scope: EXPLICIT_URL
      external_need: URL
      source_constraints: [URL_ONLY]
      execution_intent: EXPLAIN
    harness_error: false
    note: "A public URL uses direct bounded fetch, never a search-result shortcut."

  - id: ga1-grafana-only-no-broadening
    group: B
    source: general_agent_backlog
    tags: [vi, source-constraint, grafana]
    question: "Chỉ dùng Grafana để lấy CPU của monitor, không fallback sang Linux."
    expected:
      concepts: [cpu]
      operation: inspect
      intent: CPU_ASSESSMENT
      target: monitor
      params: {}
      answer_type: FACT
      routing_status: resolved
      evidence_status: partial
      answer_strategy: DETERMINISTIC_FACT
      llm_usage_reason: NONE
      required_evidence: [CPU]
      request_domain: ENVIRONMENT
      information_scope: LIVE_ENVIRONMENT
      external_need: NONE
      source_constraints: [GRAFANA]
      execution_intent: INSPECT_READ_ONLY
    harness_error: false
    note: "Planner must receive an exact Grafana allow-set and fail closed if unavailable."

  - id: ga1-generate-not-mutate
    group: M
    source: general_agent_backlog
    tags: [vi, generation, read-only]
    question: "Viết lệnh restart nginx nhưng đừng chạy nó."
    expected:
