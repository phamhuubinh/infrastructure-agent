# Golden dataset — Deterministic Reasoning v1 (DR1-004)
#
# Purpose: turning real QA transcripts into stage-level expectations so that
# concept / intent / target / params / answer_type / routing / evidence /
# LLM-usage can be scored independently of final response length.
#
# Rules:
# - Golden cases are HUMAN-REVIEWED expectations, not auto-generated output.
# - `source` records which transcript the case was curated from.
# - `harness_error: true` marks cases where the transcript problem was a
#   harness/runner bug, NOT an agent defect — such cases are excluded from
#   agent scoring.
# - Enum values (intent, answer_type, answer_strategy, llm_usage_reason)
#   MUST match the enums in src/pipeline (Intent, AnswerType,
#   AnswerStrategy, LLMUsageReason); test_golden_schema.py validates this.
# - `routing_status` uses: resolved / clarification_required / fallback /
#   unsupported / chat.
# - `evidence_status` uses: sufficient / partial / unavailable / stale /
#   contradictory / not_applicable.
#
# Group coverage (acceptance criterion): A–J each have at least one case.

schema_version: 1

groups:
  A: General Chat
  B: Intent Resolution
  C: Target Resolution
  D: Linux
  E: Process
  F: Service
  G: Grafana
  H: Zabbix
  I: Assessment
  J: Multi-intent
  M: Prompt Injection

