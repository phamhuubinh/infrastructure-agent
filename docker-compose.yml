services:
  reverse-proxy:
    image: nginx:alpine
    container_name: orion-reverse-proxy
    ports:
      - "80:80"
    environment:
      ORION_API_KEY: ${ORION_API_KEY:?ORION_API_KEY is required}
      NGINX_ENVSUBST_FILTER: ORION_API_KEY
    volumes:
      - ./docker/nginx-reverse-proxy.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: orion-api
    environment:
      ORION_DATABASE_URL: postgresql://${POSTGRES_USER:-orion}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-orion}
      ORION_API_KEY: ${ORION_API_KEY:?ORION_API_KEY is required}
      ORION_SERVERS_FILE: /root/.orion/servers.json
      ORION_MODEL_HOST_ALIAS: host.docker.internal
      ORION_PACKAGED_WEB_URL: http://localhost
      RAG_SERVICE_URL: http://rag-service:8080
      ORION_ENV: development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:61888:61888"
    volumes:
      - orion-data:/root/.orion
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:61888/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: orion-ui
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"

  postgres:
    image: postgres:16-alpine
    container_name: orion-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-orion}
    volumes:
      - orion-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orion}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"

  rag-service:
    build:
      context: src/tool/RAGTool
      dockerfile: Dockerfile
    container_name: orion-rag-service
    environment:
      RAG_EMBEDDING_PROVIDER: hash
      RAG_VECTOR_STORE: memory
      RAG_RERANKER: noop
      RAG_OCR_PROVIDER: noop
      RAG_DATA_DIR: /data
    volumes:
      - orion-ragdata:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"

volumes:
  orion-data:
  orion-pgdata:
  orion-ragdata:
