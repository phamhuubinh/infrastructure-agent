services:
  reverse-proxy:
    image: nginx:alpine
    container_name: orion-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_started
      rag-service:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: orion-api
    env_file:
      - docker-compose.env
    environment:
      ORION_DATABASE_URL: postgresql://orion:${POSTGRES_PASSWORD}@postgres:5432/orion
      RAG_SERVICE_URL: http://rag-service:8080
      ORION_ENV: development
    volumes:
      - orion-sessions:/root/.orion/sessions
      - ./servers.json:/app/servers.json:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:61888/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: orion-ui
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"

  postgres:
    image: postgres:16-alpine
    container_name: orion-pg
    env_file:
      - docker-compose.env
    volumes:
      - orion-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orion}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"

  rag-service:
    build:
      context: src/tool/RAGTool
      dockerfile: Dockerfile
    container_name: orion-rag-service
    environment:
      RAG_EMBEDDING_PROVIDER: hash
      RAG_VECTOR_STORE: memory
      RAG_RERANKER: noop
      RAG_OCR_PROVIDER: noop
      RAG_LLM_ENABLED: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"

volumes:
  orion-sessions:
  orion-pgdata:
