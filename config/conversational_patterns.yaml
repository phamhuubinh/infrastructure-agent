# Conversational detection patterns.
# File: config/conversational_patterns.yaml — Task 516
# Purpose: Externalize conversational detection patterns that were previously
# hardcoded in _is_conversational() in src/agent/deterministic_agent.py.
#
# When any of these patterns match the user's request, the request is
# treated as conversational (not an infrastructure assessment).

# Vietnamese yes-no / conversational patterns.
# Match is substring-based (pattern in lowercased input).
vi_patterns:
  - là gì
  - là ai
  - là sao
  - là như
  - có phải
  - phải không
  - đúng không
  - tại sao
  - vì sao
  - làm sao
  - như thế nào
  - thế nào
  - ra sao

# English / generic clarification patterns.
# Match is substring-based (pattern in lowercased input).
en_patterns:
  - what is
  - who is
  - how to
  - can you
  - could you
  - would you
  - please explain
  - tell me about
  - i need help
  - help me
  - define
  - meaning of

# Question-mark patterns: if the request ends with "?" and has only
# MACHINE_ASSESSMENT intent, treat as conversational.
question_mark_ends_conversational: true

# Identity/equivalence patterns. If the request contains these markers,
# treat as conversational clarification ("X là Y?", "X = Y?").
equivalence_markers:
  - " là "
  - " is "
  - "="
  - "->"