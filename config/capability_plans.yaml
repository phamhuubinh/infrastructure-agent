# Capability plans — mapping (concept, action) → evidence requirement names.
# File: config/capability_plans.yaml — Task 509
# Purpose: The CapabilityPlanner reads this to determine which capabilities
# to request for each (concept, action) pair.
#
# Names here MUST match the evidence requirement names produced by
# EvidencePlanner (e.g., "CPU", "Memory", "Storage", "Services").
# These are matched against CapabilityReference.evidence_name in
# ExecutionEngine to filter capability_references.
#
# inspect = fewer capabilities (quick check)
# diagnose = more capabilities (deeper investigation)
# summarize = lightweight view

plans:
  cpu:
    inspect:
      - CPU
      - CPU Hardware
    diagnose:
      - CPU
      - CPU Hardware
      - Processes
      - System Information
    summarize:
      - CPU

  memory:
    inspect:
      - Memory
      - Swap
    diagnose:
      - Memory
      - Swap
      - Processes
      - System Information
      - CPU
    summarize:
      - Memory

  disk:
    inspect:
      - Storage
      - Filesystem
    diagnose:
      - Storage
      - Filesystem
      - Block Devices
      - Processes
    summarize:
      - Storage

  network:
    inspect:
      - Network
    diagnose:
      - Network
      - Processes
      - System Information
    summarize:
      - Network

  gpu:
    inspect:
      - GPU Information
    diagnose:
      - GPU Information
      - Processes
      - System Information
    summarize:
      - GPU Information

  hostname:
    inspect:
      - System Information
    diagnose:
      - System Information
      - Network
    summarize:
      - System Information

  kernel:
    inspect:
      - System Information
    diagnose:
      - System Information
      - Installed Packages
    summarize:
      - System Information

  uptime:
    inspect:
      - CPU
    diagnose:
      - CPU
      - System Information
    summarize:
      - CPU

  load:
    inspect:
      - CPU
    diagnose:
      - CPU
      - Memory
      - Processes
      - System Information
    summarize:
      - CPU

  alerts:
    inspect:
      - Active Problems
    diagnose:
      - Active Problems
      - Triggers
      - Host Status
    summarize:
      - Active Problems

  dashboards:
    inspect:
      - Dashboards
    diagnose:
      - Dashboards
      - Dashboard Panels
    summarize:
      - Dashboards

  monitors:
    inspect:
      - Host Status
      - Dashboards
    diagnose:
      - Host Status
      - Active Problems
      - Triggers
      - Dashboards
      - Dashboard Panels
    summarize:
      - Host Status
      - Dashboards

  service:
    inspect:
      - Services
    diagnose:
      - Services
      - Processes
      - Recent Logs
    summarize:
      - Services

  process:
    inspect:
      - Processes
    diagnose:
      - Processes
      - CPU
      - Memory
    summarize:
      - Processes

  package:
    inspect:
      - Installed Packages
    diagnose:
      - Installed Packages
      - Services
    summarize:
      - Installed Packages

  log:
    inspect:
      - Recent Logs
    diagnose:
      - Recent Logs
      - Services
    summarize:
      - Recent Logs

  container:
    inspect:
      - Docker
    diagnose:
      - Docker
      - Processes
      - Storage
    summarize:
      - Docker

  firewall:
    inspect:
      - Firewall
    diagnose:
      - Firewall
      - Network
      - Services
    summarize:
      - Firewall

  ssh:
    inspect:
      - SSH Configuration
    diagnose:
      - SSH Configuration
      - Services
      - Recent Logs
    summarize:
      - SSH Configuration

  selinux:
    inspect:
      - SELinux
    diagnose:
      - SELinux
      - Recent Logs
    summarize:
      - SELinux

  apparmor:
    inspect:
      - AppArmor
    diagnose:
      - AppArmor
      - Recent Logs
    summarize:
      - AppArmor

  machine:
    inspect:
      - System Information
      - CPU
      - Memory
      - Storage
    diagnose:
      - System Information
      - CPU
      - Memory
      - Swap
      - Storage
      - Filesystem
      - Network
      - Services
      - Processes
      - Time Synchronization
      - Recent Logs
      - Docker
      - Block Devices
    summarize:
      - System Information
      - CPU
      - Memory
      - Storage