schema_version: reasoning.v1
atomic_rules:
  - id: cpu.usage.critical
    metric: cpu.usage
    operator: gt
    threshold: 90
    severity: critical
    version: 1.0.0
    owner: orion-core
    rationale: Sustained CPU utilization above 90 percent is critical pressure.
    source_cases: [DR1-601]
    review_status: approved
  - id: cpu.usage.warning
    metric: cpu.usage
    operator: gt
    threshold: 80
    severity: warning
    version: 1.0.0
    owner: orion-core
    rationale: CPU utilization above 80 percent warrants investigation.
    source_cases: [DR1-601]
    review_status: approved
  - id: cpu.load_per_core.critical
    metric: cpu.load_per_core
    operator: gt
    threshold: 2
    severity: critical
    version: 1.0.0
    owner: orion-core
    rationale: Load above two runnable tasks per logical core is critical pressure.
    source_cases: [DR1-601]
    required_context: [cpu.logical_cores]
    review_status: approved
  - id: cpu.load_per_core.warning
    metric: cpu.load_per_core
    operator: gt
    threshold: 1
    severity: warning
    version: 1.0.0
    owner: orion-core
    rationale: Load above one runnable task per logical core indicates contention.
    source_cases: [DR1-601]
    required_context: [cpu.logical_cores]
    review_status: approved
  - id: memory.usage.critical
    metric: memory.usage
    operator: gt
    threshold: 90
    severity: critical
    version: 1.0.0
    owner: orion-core
    rationale: Memory use above 90 percent leaves little recovery headroom.
    source_cases: [DR1-601]
    review_status: approved
  - id: memory.usage.warning
    metric: memory.usage
    operator: gt
    threshold: 80
    severity: warning
    version: 1.0.0
    owner: orion-core
    rationale: Memory use above 80 percent warrants pressure checks.
    source_cases: [DR1-601]
    review_status: approved
  - id: swap.usage.critical
    metric: swap.usage
    operator: gt
    threshold: 80
    severity: critical
    version: 1.0.0
    owner: orion-core
    rationale: Swap utilization above 80 percent risks severe paging pressure.
    source_cases: [DR1-601]
    review_status: approved
  - id: swap.usage.warning
    metric: swap.usage
    operator: gt
    threshold: 50
    severity: warning
    version: 1.0.0
    owner: orion-core
    rationale: Swap utilization above 50 percent is a memory pressure signal.
    source_cases: [DR1-601]
    review_status: approved
  - id: filesystem.usage.critical
    metric: filesystem.usage
    operator: gt
    threshold: 90
    severity: critical
    version: 1.0.0
    owner: orion-core
    rationale: Filesystem utilization above 90 percent has low write headroom.
    source_cases: [DR1-601]
    review_status: approved
  - id: filesystem.usage.warning
    metric: filesystem.usage
    operator: gt
    threshold: 80
    severity: warning
    version: 1.0.0
    owner: orion-core
    rationale: Filesystem utilization above 80 percent warrants capacity review.
    source_cases: [DR1-601]
    review_status: approved
  - id: filesystem.inode_usage.critical
    metric: filesystem.inode_usage
    operator: gt
    threshold: 90
    severity: critical
    version: 1.0.0
    owner: orion-core
    rationale: Inode utilization above 90 percent can prevent new file creation.
    source_cases: [DR1-601]
    review_status: approved
  - id: filesystem.inode_usage.warning
    metric: filesystem.inode_usage
    operator: gt
    threshold: 80
    severity: warning
    version: 1.0.0
    owner: orion-core
    rationale: Inode utilization above 80 percent warrants investigation.
    source_cases: [DR1-601]
    review_status: approved
  - id: process.zombie_count.warning
    metric: process.zombie_count
    operator: gt
    threshold: 0
    severity: warning
    version: 1.0.0
    owner: orion-core
    rationale: Any zombie process is an observable process lifecycle defect.
    source_cases: [DR1-601]
    review_status: approved
composite_rules:
  - id: cpu.saturation
    type: cpu_saturation
    version: 1.0.0
    severity: critical
    owner: orion-core
    rationale: CPU saturation requires both high utilization and per-core run queue pressure.
    source_cases: [DR1-602, DR1-603]
    review_status: approved
    decision_threshold: 0.80
    minimum_coverage: 0.80
    conditions:
      - id: cpu-high
        metric: cpu.usage
        operator: gt
        threshold: 80
        weight: 0.45
        required: true
      - id: load-per-core-high
        metric: cpu.load_per_core
        operator: gt
        threshold: 1
        weight: 0.35
        required: true
      - id: iowait-high
        metric: cpu.iowait
        operator: gt
        threshold: 20
        weight: 0.20
        required: false
  - id: memory.pressure
    type: memory_pressure
    version: 1.0.0
    severity: warning
    owner: orion-core
    rationale: High memory use is strengthened by observed swap use.
    source_cases: [DR1-602]
    review_status: approved
    decision_threshold: 0.55
    minimum_coverage: 0.55
    conditions:
      - id: memory-high
        metric: memory.usage
        operator: gt
        threshold: 85
        weight: 0.55
        required: true
      - id: swap-active
        metric: swap.usage
        operator: gt
        threshold: 20
        weight: 0.45
        required: false
  - id: filesystem.pressure
    type: filesystem_pressure
    version: 1.0.0
    severity: warning
    owner: orion-core
    rationale: Capacity and inode exhaustion are evaluated together without hiding either gap.
    source_cases: [DR1-602]
    review_status: approved
    decision_threshold: 0.70
    minimum_coverage: 0.70
    conditions:
      - id: space-high
        metric: filesystem.usage
        operator: gt
        threshold: 80
        weight: 0.70
        required: true
      - id: inode-high
        metric: filesystem.inode_usage
        operator: gt
        threshold: 80
        weight: 0.30
        required: false
  - id: system.overload
    type: system_overload
    version: 1.0.0
    severity: critical
    owner: orion-core
    rationale: Pressure in at least two independent resource domains indicates system overload.
    source_cases: [DR1-605]
    review_status: approved
    decision_threshold: 0.66
    minimum_coverage: 0.66
    conditions:
      - id: cpu-high
        metric: cpu.usage
        operator: gt
        threshold: 80
        weight: 0.34
        required: false
      - id: memory-high
        metric: memory.usage
        operator: gt
        threshold: 85
        weight: 0.33
        required: false
      - id: disk-high
        metric: filesystem.usage
        operator: gt
        threshold: 80
        weight: 0.33
        required: false
