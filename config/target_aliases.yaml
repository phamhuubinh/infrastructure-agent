# Synonyms that imply localhost.
localhost_synonyms:
  - localhost
  - 127.0.0.1
  - "::1"
  - máy này
  - máy
  - host này
  - host hiện tại
  - server này

# Pattern-based target name normalization rules.
# Each rule has:
#   pattern: regex pattern to match
#   replacement: replacement string (can use backreferences)
#   description: human-readable description
target_patterns:
  - pattern: "^srv(\\d+)$"
    replacement: "server\\1"
    description: "srv01 → server01"
  - pattern: "^sv0?(\\d+)$"
    replacement: "server0\\1"
    description: "sv01 → server01, sv1 → server01"
  - pattern: "^mon(\\d+)$"
    replacement: "monitor"
    description: "mon01 → monitor"
  - pattern: "^(\\w+)-(\\d+)$"
    replacement: "\\1\\2"
    description: "server-01 → server01 (strip dash)"
  - pattern: "^(\\w+)_(\\d+)$"
    replacement: "\\1\\2"
    description: "server_01 → server01 (strip underscore)"
