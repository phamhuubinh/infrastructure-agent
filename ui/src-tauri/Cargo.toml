[package]
name = "orion-native"
version = "0.1.3"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tokio", "dep:tokio-util"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[[bin]]
name = "orion-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[target.'cfg(windows)'.dependencies]
base64 = "0.22.1"
getrandom = "0.3.4"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", default-features = false, features = ["wry"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "sync"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
url = "2.5"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "net"] }

[target.'cfg(target_os = "android")'.dependencies]
base64 = "0.22.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", default-features = false, features = ["wry"], optional = true }
tokio = { version = "1", features = ["macros", "sync"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
url = "2.5"
webpki-roots = "1"

[target.'cfg(target_os = "ios")'.dependencies]
base64 = "0.22.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream"] }
security-framework = "3.7"
security-framework-sys = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", default-features = false, features = ["wry"], optional = true }
tokio = { version = "1", features = ["macros", "sync"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
url = "2.5"
