[project]
name = "orion-rag-service"
version = "1.0.0"
description = "Project-isolated document analysis service for Orion."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "requests>=2.32",
    "scikit-learn>=1.4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# Root Orion uses importlib mode; make the standalone RAG package explicit so
# CI and local `uv run pytest` resolve its top-level `app` package identically.
pythonpath = [".", "../../.."]
