name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - '.github/workflows/release.yml'
      - 'install.ps1'
      - 'backend/**'
      - 'worker/**'
      - 'scripts/worker/**'
      - 'ui/**'
      - 'scripts/windows/**'
      - 'scripts/release/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - '.github/workflows/release.yml'
      - 'install.ps1'
      - 'backend/**'
      - 'worker/**'
      - 'scripts/worker/**'
      - 'ui/**'
      - 'scripts/windows/**'
      - 'scripts/release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source checkout with spaces
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: source checkout with spaces
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: source checkout with spaces/ui/package-lock.json
      - name: Check scheduler and MCP contracts on native Windows
        shell: powershell
        run: |
          python -m pip install -e "./backend[dev]"
          if ($LASTEXITCODE -ne 0) { throw 'Backend installation failed' }
          python -m pytest backend/tests/test_scheduler.py backend/tests/test_scheduler_api.py backend/tests/test_remote_access.py backend/tests/test_mcp.py backend/tests/test_endpoints.py
          if ($LASTEXITCODE -ne 0) { throw 'Scheduler, MCP and remote route-policy tests failed' }
      - name: Parse native PowerShell scripts
        shell: powershell
        run: ./scripts/windows/installer-check.ps1 -ParseOnly
      - name: Check launcher creation and replacement without dependencies
        shell: powershell
        run: ./scripts/windows/test-launcher.ps1
      - name: Check smoke helpers
        shell: powershell
        run: |
          python -m pip install ruff
          if ($LASTEXITCODE -ne 0) { throw 'Lint tooling installation failed' }
          ruff check scripts/release scripts/windows
          if ($LASTEXITCODE -ne 0) { throw 'Smoke helper lint failed' }
          ruff format --check scripts/release scripts/windows
          if ($LASTEXITCODE -ne 0) { throw 'Smoke helper formatting failed' }
      - name: Exercise source installer and local runtime
        shell: powershell
        run: |
          python scripts/windows/installer_smoke.py "$PWD"
          if ($LASTEXITCODE -ne 0) { throw 'Source Windows smoke failed' }
          git status --short
      - name: Check out clean source for release assembly
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: release source checkout
      - name: Assemble release candidate using the existing payload builder
        shell: powershell
        run: |
          python -m pip install build
          if ($LASTEXITCODE -ne 0) { throw 'Build tooling installation failed' }
          $work = Join-Path $env:RUNNER_TEMP 'windows release candidate'
          $releaseSource = Join-Path $env:GITHUB_WORKSPACE 'release source checkout'
          python -m build --wheel "$releaseSource/backend" --outdir "$work/dist"
          if ($LASTEXITCODE -ne 0) { throw 'Wheel build failed' }
          $wheel = (Get-ChildItem "$work/dist/orion-*-py3-none-any.whl").FullName
          python "$releaseSource/scripts/release/payload.py" build --repository "$releaseSource" --wheel "$wheel" --ui ui/dist/client --output "$work/artifacts"
          if ($LASTEXITCODE -ne 0) { throw 'Release payload build failed' }
          $archive = Get-ChildItem "$work/artifacts/orion-*-windows-x64.zip"
          $expected = (Get-Content "$work/artifacts/SHA256SUMS" | Where-Object { $_.EndsWith($archive.Name) }).Split(' ')[0]
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath "$work/extracted"
      - name: Exercise archived release installer and local runtime
        shell: powershell
        run: |
          $bundle = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'windows release candidate/extracted') -Directory).FullName
          python scripts/release/smoke.py "$bundle" windows-x64
          if ($LASTEXITCODE -ne 0) { throw 'Release Windows smoke failed' }

      - name: Native endpoint browser and desktop fixture
        shell: powershell
        run: |
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser provisioning failed' }
          $env:ORION_NATIVE_TESTS = '1'
          python -m pytest backend/tests/test_endpoint_native.py
          if ($LASTEXITCODE -ne 0) { throw 'Native endpoint tests failed' }
      - name: Build and smoke archived Windows worker
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'worker release candidate'
          $releaseSource = Join-Path $env:GITHUB_WORKSPACE 'release source checkout'
          python -m build --wheel "$releaseSource/worker" --outdir "$work/dist"
          if ($LASTEXITCODE -ne 0) { throw 'Worker wheel failed' }
          $wheel = (Get-ChildItem "$work/dist/orion_worker-*.whl").FullName
          python "$releaseSource/scripts/worker/payload.py" --repository "$releaseSource" --wheel "$wheel" --output "$work/artifacts"
          if ($LASTEXITCODE -ne 0) { throw 'Worker artifacts failed' }
          $archive = (Get-ChildItem "$work/artifacts/orion-worker-*-windows-x64.zip").FullName
          Expand-Archive -LiteralPath $archive -DestinationPath "$work/extracted"
          $bundle = (Get-ChildItem "$work/extracted" -Directory).FullName
          python scripts/worker/smoke.py "$bundle"
          if ($LASTEXITCODE -ne 0) { throw 'Windows worker smoke failed' }
