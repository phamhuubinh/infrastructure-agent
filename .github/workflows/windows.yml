name: Windows CI

on:
  push:
    branches: [main, 'codex/orion-r16-r18']
    paths:
      - '.github/workflows/windows.yml'
      - '.github/workflows/release.yml'
      - 'install.ps1'
      - 'backend/**'
      - 'worker/**'
      - 'scripts/worker/**'
      - 'ui/**'
      - 'scripts/windows/**'
      - 'scripts/desktop/**'
      - 'scripts/release/**'
      - 'scripts/refactor/**'
      - '.python-version'
      - '.node-version'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - '.github/workflows/release.yml'
      - 'install.ps1'
      - 'backend/**'
      - 'worker/**'
      - 'scripts/worker/**'
      - 'ui/**'
      - 'scripts/windows/**'
      - 'scripts/desktop/**'
      - 'scripts/release/**'
      - 'scripts/refactor/**'
      - '.python-version'
      - '.node-version'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source checkout with spaces
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: source checkout with spaces
      - uses: actions/setup-python@v5
        with:
          python-version-file: source checkout with spaces/.python-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: source checkout with spaces/.node-version
          cache: npm
          cache-dependency-path: source checkout with spaces/ui/package-lock.json
      - name: Install backend on native Windows
        timeout-minutes: 12
        shell: powershell
        run: |
          python scripts/windows/regression_check.py install
          if ($LASTEXITCODE -ne 0) { throw 'Backend installation failed' }
      - name: Check scheduler and MCP contracts on native Windows
        timeout-minutes: 6
        shell: powershell
        run: |
          python scripts/windows/regression_check.py test
          if ($LASTEXITCODE -ne 0) { throw 'Scheduler, MCP and remote route-policy tests failed' }
      - name: Preserve native regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-regression-diagnostics
          path: ${{ runner.temp }}/orion-native-regression-*.log
      - name: Parse native PowerShell scripts
        shell: powershell
        run: ./scripts/windows/installer-check.ps1 -ParseOnly
      - name: Check launcher creation and replacement without dependencies
        shell: powershell
        run: ./scripts/windows/test-launcher.ps1
      - name: Check smoke helpers
        shell: powershell
        run: |
          python -m ruff --version
          if ($LASTEXITCODE -ne 0) { throw 'Lint tooling installation failed' }
          ruff check scripts/release scripts/windows
          if ($LASTEXITCODE -ne 0) { throw 'Smoke helper lint failed' }
          ruff format --check scripts/release scripts/windows
          if ($LASTEXITCODE -ne 0) { throw 'Smoke helper formatting failed' }
      - name: Exercise source installer and local runtime
        shell: powershell
        run: |
          python scripts/windows/installer_smoke.py "$PWD"
          if ($LASTEXITCODE -ne 0) { throw 'Source Windows smoke failed' }
          git status --short
      - name: Check out clean source for release assembly
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: release source checkout
      - name: Assemble release candidate using the existing payload builder
        shell: powershell
        run: |
          python -m build --version
          if ($LASTEXITCODE -ne 0) { throw 'Build tooling installation failed' }
          $work = Join-Path $env:RUNNER_TEMP 'windows release candidate'
          $releaseSource = Join-Path $env:GITHUB_WORKSPACE 'release source checkout'
          python -m build --no-isolation --wheel "$releaseSource/backend" --outdir "$work/dist"
          if ($LASTEXITCODE -ne 0) { throw 'Wheel build failed' }
          $wheel = (Get-ChildItem "$work/dist/orion-*-py3-none-any.whl").FullName
          python "$releaseSource/scripts/release/payload.py" build --repository "$releaseSource" --wheel "$wheel" --ui ui/dist/client --output "$work/artifacts"
          if ($LASTEXITCODE -ne 0) { throw 'Release payload build failed' }
          $archive = Get-ChildItem "$work/artifacts/orion-*-windows-x64.zip"
          $expected = (Get-Content "$work/artifacts/SHA256SUMS" | Where-Object { $_.EndsWith($archive.Name) }).Split(' ')[0]
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath "$work/extracted"
      - name: Exercise archived release installer and local runtime
        shell: powershell
        run: |
          $bundle = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'windows release candidate/extracted') -Directory).FullName
          python scripts/release/smoke.py "$bundle" windows-x64
          if ($LASTEXITCODE -ne 0) { throw 'Release Windows smoke failed' }

      - name: Build and smoke the managed Windows backend
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'windows release candidate'
          $wheel = (Get-ChildItem "$work/dist/orion-*-py3-none-any.whl").FullName
          $sidecar = Join-Path $work 'managed-backend'
          python scripts/desktop/build_sidecar.py --wheel "$wheel" --output "$sidecar"
          if ($LASTEXITCODE -ne 0) { throw 'Windows backend sidecar build failed' }
          $env:ORION_TEST_MANAGED_EXE = Join-Path $sidecar 'OrionBackend.exe'
          python -m pytest backend/tests/test_headless_cli.py -k managed_serve
          if ($LASTEXITCODE -ne 0) { throw 'Windows backend sidecar smoke failed' }
          $env:ORION_TEST_MANAGED_DATA_DIR = Join-Path $work 'native host smoke data'
          New-Item -ItemType Directory -Force release-work | Out-Null
          Copy-Item -LiteralPath $sidecar -Destination release-work/managed-backend -Recurse
          Push-Location ui/src-tauri
          try {
            cargo test --locked
            if ($LASTEXITCODE -ne 0) { throw 'Managed backend supervisor tests failed' }
            cargo test --locked -- --ignored
            if ($LASTEXITCODE -ne 0) { throw 'Managed backend supervisor or credential vault native smoke failed' }
            cargo check --locked --features custom-protocol
            if ($LASTEXITCODE -ne 0) { throw 'Tauri desktop compilation check failed' }
          } finally {
            Pop-Location
          }

      - name: Native endpoint browser and desktop fixture
        shell: powershell
        run: |
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser provisioning failed' }
          $env:ORION_NATIVE_TESTS = '1'
          python -m pytest backend/tests/test_endpoint_native.py
          if ($LASTEXITCODE -ne 0) { throw 'Native endpoint tests failed' }
      - name: Build and smoke archived Windows worker
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'worker release candidate'
          $releaseSource = Join-Path $env:GITHUB_WORKSPACE 'release source checkout'
          python -m build --no-isolation --wheel "$releaseSource/worker" --outdir "$work/dist"
          if ($LASTEXITCODE -ne 0) { throw 'Worker wheel failed' }
          $wheel = (Get-ChildItem "$work/dist/orion_worker-*.whl").FullName
          python "$releaseSource/scripts/worker/payload.py" --repository "$releaseSource" --wheel "$wheel" --output "$work/artifacts"
          if ($LASTEXITCODE -ne 0) { throw 'Worker artifacts failed' }
          $archive = Get-ChildItem "$work/artifacts/orion-worker-*-windows-x64.zip"
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksums = Get-Content "$work/artifacts/SHA256SUMS"
          if ("$hash  $($archive.Name)" -cnotin $checksums) { throw 'Worker archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath "$work/extracted"
          $bundle = (Get-ChildItem "$work/extracted" -Directory).FullName
          python scripts/worker/smoke.py "$bundle"
          if ($LASTEXITCODE -ne 0) { throw 'Windows worker smoke failed' }
      - name: Build and smoke zero-install portable Windows worker
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'portable worker candidate'
          $releaseSource = Join-Path $env:GITHUB_WORKSPACE 'release source checkout'
          python "$releaseSource/scripts/worker/portable.py" --repository "$releaseSource" --output "$work/artifacts"
          if ($LASTEXITCODE -ne 0) { throw 'Portable Windows build failed' }
          $archive = (Get-ChildItem "$work/artifacts/OrionRemote-*-windows-x64.zip").FullName
          Expand-Archive -LiteralPath $archive -DestinationPath "$work/extracted"
          $bundle = (Get-ChildItem "$work/extracted" -Directory).FullName
          $env:ORION_PORTABLE_BROWSER_TESTS = '1'
          python scripts/worker/portable_smoke.py "$bundle"
          if ($LASTEXITCODE -ne 0) { throw 'Portable Windows smoke failed' }

      - name: Build and exercise installed Windows desktop app
        shell: powershell
        run: |
          Push-Location ui
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency install failed' }
            npm run desktop:build -- --debug --bundles nsis --no-sign
            if ($LASTEXITCODE -ne 0) { throw 'Windows desktop bundle failed' }
          } finally {
            Pop-Location
          }
          $bundles = @(Get-ChildItem 'ui/src-tauri/target/debug/bundle/nsis' -Filter '*-setup.exe')
          if ($bundles.Count -ne 1) { throw 'Expected one desktop installer' }
          $installer = $bundles[0].FullName
          Get-FileHash -LiteralPath $installer -Algorithm SHA256
          $desktop = Join-Path $env:LOCALAPPDATA 'Orion'
          if (Test-Path -LiteralPath $desktop) { throw 'Desktop smoke requires a fresh runner' }
          $setup = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw 'Desktop install failed' }
          try {
            $env:PYTHONPATH = (Resolve-Path 'backend/src').Path
            python scripts/desktop/smoke.py "$desktop/Orion.exe" "$env:RUNNER_TEMP/orion-desktop.log"
            if ($LASTEXITCODE -ne 0) {
              Get-Process -Name msedgewebview2,Orion,OrionBackend -ErrorAction SilentlyContinue |
                Select-Object ProcessName, Id, SessionId, Path | Format-Table -AutoSize
              Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-10); Level=2} -ErrorAction SilentlyContinue |
                Select-Object -First 10 TimeCreated, ProviderName, Id, Message | Format-List
              throw 'Installed WebView2 smoke failed'
            }
            $db = Join-Path $env:LOCALAPPDATA 'io.orion.desktop/managed/orion.db'
            $databaseHash = (Get-FileHash -LiteralPath $db -Algorithm SHA256).Hash
          } finally {
            $uninstall = Start-Process -FilePath "$desktop/uninstall.exe" -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
            if ($uninstall.ExitCode -ne 0) { throw 'Desktop uninstall failed' }
          }
          if (Test-Path -LiteralPath "$desktop/Orion.exe") { throw 'Desktop app remained after uninstall' }
          if ((Get-FileHash -LiteralPath $db -Algorithm SHA256).Hash -ne $databaseHash) {
            throw 'Uninstall changed the fixture database'
          }
      - name: Preserve desktop smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-diagnostics
          path: ${{ runner.temp }}/orion-desktop.log
          if-no-files-found: ignore
