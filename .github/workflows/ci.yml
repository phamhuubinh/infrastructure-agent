name: CI

on:
  push:
    branches: [main, 'codex/orion-r16-r18']
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install backend
        run: python scripts/refactor/dev.py bootstrap --backend-only --python "$(command -v python)"
      - name: Check backend
        run: python scripts/refactor/dev.py check --backend-only --python "$(command -v python)"
      - name: Smoke installed headless Linux wheel
        run: |
          python -m build --no-isolation --wheel backend --outdir "$RUNNER_TEMP/orion-headless-dist"
          python -m venv "$RUNNER_TEMP/orion-headless"
          "$RUNNER_TEMP/orion-headless/bin/python" -m pip install --require-hashes -r scripts/refactor/locks/core.txt
          "$RUNNER_TEMP/orion-headless/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/orion-headless-dist/orion-*.whl
          "$RUNNER_TEMP/orion-headless/bin/python" -m pip check
          python scripts/linux/headless_smoke.py "$RUNNER_TEMP/orion-headless/bin/orion"

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
        working-directory: ui
      - name: Check UI
        run: |
          npm run lint
          npx tsc --noEmit
          npm test -- --run
          npm run test:packaged-ui
        working-directory: ui

  acceptance-extra:
    needs: [backend, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install backend
        run: python scripts/refactor/dev.py bootstrap --backend-only --python "$(command -v python)"
      - name: Check generated OpenAPI and SDK
        run: |
          python backend/scripts/openapi.py
          python backend/scripts/sdk.py
      - name: Check architecture
        run: python backend/scripts/architecture_check.py
      - name: Check operations lifecycle
        run: python backend/scripts/operations_check.py

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python scripts/refactor/dev.py bootstrap --backend-only --python "$(command -v python)"
      - run: python -m playwright install --with-deps chromium
      - name: Native Linux browser and X11 fixture
        run: ORION_NATIVE_TESTS=1 xvfb-run -a -s '-screen 0 1280x1024x24 -noreset' python -m pytest backend/tests/test_endpoints.py backend/tests/test_endpoint_native.py
      - name: Build lightweight worker artifacts
        run: |
          python -m build --no-isolation --wheel worker --outdir release-work/worker-dist
          python scripts/worker/payload.py --wheel release-work/worker-dist/orion_worker-*-py3-none-any.whl --output release-work/worker-artifacts
      - name: Smoke archived Linux worker
        run: |
          (cd release-work/worker-artifacts && sha256sum -c SHA256SUMS)
          mkdir -p release-work/extracted
          tar -xzf release-work/worker-artifacts/orion-worker-*-linux-x86_64.tar.gz -C release-work/extracted
          python scripts/worker/smoke.py release-work/extracted/orion-worker-*-linux-x86_64
      - name: Build and smoke zero-install portable Linux worker
        run: |
          python scripts/worker/portable.py --output release-work/portable
          tar -xzf release-work/portable/OrionRemote-*-linux-x86_64.tar.gz -C release-work/extracted
          ORION_PORTABLE_BROWSER_TESTS=1 python scripts/worker/portable_smoke.py release-work/extracted/OrionRemote-*-linux-x86_64

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Android debug APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          test -d "$NDK_HOME"
          (cd src-tauri && rustup target add aarch64-linux-android)
          npm ci
          npm exec -- tauri android init --ci --skip-targets-install
          npm exec -- tauri android build --ci --debug --apk --target aarch64 --features desktop
      - name: Verify Android archive
        run: |
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -tq "$apk"
          unzip -Z1 "$apk" | awk '/^lib\/arm64-v8a\/[^/]+\.so$/ { found=1 } END { exit !found }'
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: orion-android-debug-arm64
          path: ui/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Build x86_64 debug APK for the emulator
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          (cd src-tauri && rustup target add x86_64-linux-android)
          npm exec -- tauri android build --ci --debug --apk --target x86_64 --features desktop
      - name: Install, launch and resume Orion on Android
        run: |
          image="system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "platform-tools" "$image"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-orion-ci-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          export ANDROID_AVD_HOME="$RUNNER_TEMP/orion-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          df -h "$ANDROID_AVD_HOME"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n orion-ci -k "$image"
          "$ANDROID_HOME/emulator/emulator" -avd orion-ci -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan -cores 2 -memory 2048 > "$RUNNER_TEMP/orion-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'status=$?; kill "$emulator_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat "$RUNNER_TEMP/orion-emulator.log"; fi; exit "$status"' EXIT
          adb="$ANDROID_HOME/platform-tools/adb"
          for attempt in {1..120}; do
            kill -0 "$emulator_pid"
            if "$adb" get-state 2>/dev/null | grep -Fxq device; then break; fi
            sleep 2
          done
          "$adb" get-state | grep -Fxq device
          for attempt in {1..90}; do
            if [ "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" = 1
          apk=""
          while IFS= read -r candidate; do
            if unzip -Z1 "$candidate" | awk '/^lib\/x86_64\/[^/]+\.so$/ { found=1 } END { exit !found }'; then
              apk="$candidate"
              break
            fi
          done < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          test -n "$apk"
          "$adb" install "$apk"
          "$adb" shell am start -W -n io.orion.desktop/.MainActivity | grep -Fx 'Status: ok'
          "$adb" shell input keyevent KEYCODE_HOME
          "$adb" shell am start -W -n io.orion.desktop/.MainActivity | grep -Fx 'Status: ok'
          "$adb" shell pidof io.orion.desktop
          "$adb" uninstall io.orion.desktop
          python ../scripts/refactor/dev.py bootstrap --backend-only --python "$(command -v python)"
          serial="$("$adb" get-serialno)"
          python ../scripts/android/smoke.py "$apk" --adb "$adb" --serial "$serial" --extended

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build iOS simulator app
        run: |
          xcrun --sdk iphonesimulator --show-sdk-version
          (cd src-tauri && rustup target add aarch64-apple-ios-sim)
          npm ci
          npm exec -- tauri ios init --ci --skip-targets-install
          npm exec -- tauri ios build --ci --debug --target aarch64-sim --features desktop

      - name: Install and launch Orion in iOS Simulator
        run: |
          app="src-tauri/gen/apple/build/arm64-sim/Orion.app"
          test -d "$app"
          device="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in sorted(devices, reverse=True) if ".iOS-" in runtime for device in devices[runtime] if device["name"].startswith("iPhone") and device["isAvailable"]))')"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          trap 'xcrun simctl shutdown "$device" || true' EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          xcrun simctl get_app_container "$device" "$bundle_id"
          xcrun simctl launch "$device" "$bundle_id"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/orion-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: orion-ios-arm64-simulator
          path: ${{ runner.temp }}/orion-ios-simulator.zip
          if-no-files-found: error
