name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -e "./backend[dev]"
      - name: Check backend
        run: |
          cd backend
          ruff check src tests
          ruff format --check src tests
          mypy src
          pytest

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
        working-directory: ui
      - name: Check UI
        run: |
          npm run lint
          npx tsc --noEmit
          npm test -- --run
          npm run test:packaged-ui
        working-directory: ui

  acceptance-extra:
    needs: [backend, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install backend
        run: python -m pip install -e "./backend[dev]"
      - name: Check generated OpenAPI
        run: |
          python backend/scripts/openapi.py --write
          git diff --exit-code -- ui/openapi.json
      - name: Check architecture
        run: python backend/scripts/architecture_check.py
      - name: Check operations lifecycle
        run: python backend/scripts/operations_check.py
